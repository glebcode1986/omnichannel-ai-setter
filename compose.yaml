# Local development/test infrastructure. Credentials are fake, local-only defaults — never reuse them.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: omnichannel
      POSTGRES_PASSWORD: omnichannel-local-only
      POSTGRES_DB: omnichannel
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnichannel -d omnichannel"]
      interval: 2s
      timeout: 3s
      retries: 30
