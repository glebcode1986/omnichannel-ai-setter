# Local development/test infrastructure. Credentials are fake, local-only defaults — never reuse them.
services:
  postgres:
    # pgvector's own image: the same PostgreSQL 17 plus the `vector` extension retrieval needs (ADR-011).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: omnichannel
      POSTGRES_PASSWORD: omnichannel-local-only
      POSTGRES_DB: omnichannel
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnichannel -d omnichannel"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Append-only persistence so delayed jobs survive a restart, as in production (ADR-003).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
